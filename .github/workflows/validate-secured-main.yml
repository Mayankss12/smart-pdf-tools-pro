name: Validate secured main

on:
  push:
    branches:
      - codex/dependency-security-hardening-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(counts, null, 2));
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0 || (counts.moderate ?? 0) > 0 || (counts.low ?? 0) > 0) process.exit(1);
          NODE
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
