name: Validate PDFMantra

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Align legacy editor accessibility assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verified-bugs-smoke.mjs")
          source = path.read_text(encoding="utf-8")
          old = 'assert.match(objectFrame, /aria-pressed=\\{selected\\}/);'
          new = '''assert.match(objectFrame, /role="group"/);
          assert.match(objectFrame, /aria-label=\\{`\\$\\{toolbarLabel\\} object/);'''
          if old in source:
              path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          if ! git diff --quiet; then
            git config user.name "PDFMantra Validation"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/verified-bugs-smoke.mjs
            git commit -m "Align editor accessibility regression coverage"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Launch audit
        run: npm run audit:launch
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
