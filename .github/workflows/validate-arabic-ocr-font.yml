name: Validate Arabic OCR Font

on:
  push:
    branches:
      - fix/local-arabic-ocr-font

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Arabic font
        run: |
          test -s public/fonts/NotoNaskhArabic-Regular.ttf
          file public/fonts/NotoNaskhArabic-Regular.ttf | grep -q "TrueType Font"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Launch audit
        run: npm run audit:launch
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
