name: Codex validation

on:
  push:
    branches:
      - fix/editor-ocr-unsaved-state

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run audit:launch
      - run: npm run test:smoke
      - run: npm run build
