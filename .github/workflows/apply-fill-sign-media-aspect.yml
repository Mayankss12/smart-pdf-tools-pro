name: Apply Fill Sign media aspect lock

on:
  push:
    branches:
      - codex/fill-sign-media-aspect-lock-v3

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fill-sign-media-aspect-lock-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Fill & Sign page with guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/tools/fill-sign/page.tsx")
          text = path.read_text()

          replacements = [
              (
                  '''import {
            isProportionalFillSignMarkKind,
            normalizeProportionalMarkBox,
            resizeProportionalMarkBox,
            scaleProportionalMarkBox,
          } from "@/lib/fill-sign-layout";''',
                  '''import {
            isProportionalFillSignMarkKind,
            normalizeProportionalMarkBox,
            normalizeProportionalMediaBox,
            resizeProportionalMarkBox,
            resizeProportionalMediaBox,
            scaleProportionalMarkBox,
            scaleProportionalMediaBox,
          } from "@/lib/fill-sign-layout";''',
              ),
              (
                  '''          if (isProportionalFillSignMarkKind(object.kind)) {
            return {
              ...object,
              box: resizeProportionalMarkBox({
                box: start,
                handle: dragState.handle,
                deltaXPercent: dxPercent,
                deltaYPercent: dyPercent,
                page: { width: rect.width, height: rect.height },
                minWidthPercent: minBox.width,
                minHeightPercent: minBox.height,
              }),
            };
          }

          let nextX = start.xPercent;''',
                  '''          if (isProportionalFillSignMarkKind(object.kind)) {
            return {
              ...object,
              box: resizeProportionalMarkBox({
                box: start,
                handle: dragState.handle,
                deltaXPercent: dxPercent,
                deltaYPercent: dyPercent,
                page: { width: rect.width, height: rect.height },
                minWidthPercent: minBox.width,
                minHeightPercent: minBox.height,
              }),
            };
          }

          if (
            object.image &&
            (object.kind === "image" || object.kind === "signature")
          ) {
            return {
              ...object,
              box: resizeProportionalMediaBox({
                box: start,
                handle: dragState.handle,
                deltaXPercent: dxPercent,
                deltaYPercent: dyPercent,
                page: { width: rect.width, height: rect.height },
                aspectRatio:
                  object.image.width / Math.max(1, object.image.height),
                minWidthPercent: minBox.width,
                minHeightPercent: minBox.height,
              }),
            };
          }

          let nextX = start.xPercent;''',
              ),
              (
                  '''    if (
      isProportionalFillSignMarkKind(kind) &&
      pageRect &&
      pageRect.width > 0 &&
      pageRect.height > 0
    ) {
      defaultBox = normalizeProportionalMarkBox(defaultBox, {
        width: pageRect.width,
        height: pageRect.height,
      });
    }
''',
                  '''    if (
      isProportionalFillSignMarkKind(kind) &&
      pageRect &&
      pageRect.width > 0 &&
      pageRect.height > 0
    ) {
      defaultBox = normalizeProportionalMarkBox(defaultBox, {
        width: pageRect.width,
        height: pageRect.height,
      });
    } else if (
      image &&
      (kind === "image" || kind === "signature") &&
      pageRect &&
      pageRect.width > 0 &&
      pageRect.height > 0
    ) {
      defaultBox = normalizeProportionalMediaBox({
        box: defaultBox,
        page: { width: pageRect.width, height: pageRect.height },
        aspectRatio: image.width / Math.max(1, image.height),
        minWidthPercent: getMinBox(kind).width,
        minHeightPercent: getMinBox(kind).height,
      });
    }
''',
              ),
              (
                  '''          if (
            isProportionalFillSignMarkKind(object.kind) &&
            pageRect &&
            pageRect.width > 0 &&
            pageRect.height > 0
          ) {
            return {
              ...object,
              box: scaleProportionalMarkBox(object.box, delta, {
                width: pageRect.width,
                height: pageRect.height,
              }),
            };
          }

          return {''',
                  '''          if (
            isProportionalFillSignMarkKind(object.kind) &&
            pageRect &&
            pageRect.width > 0 &&
            pageRect.height > 0
          ) {
            return {
              ...object,
              box: scaleProportionalMarkBox(object.box, delta, {
                width: pageRect.width,
                height: pageRect.height,
              }),
            };
          }

          if (
            object.image &&
            (object.kind === "image" || object.kind === "signature") &&
            pageRect &&
            pageRect.width > 0 &&
            pageRect.height > 0
          ) {
            return {
              ...object,
              box: scaleProportionalMediaBox({
                box: object.box,
                deltaWidthPercent: delta,
                page: { width: pageRect.width, height: pageRect.height },
                aspectRatio:
                  object.image.width / Math.max(1, object.image.height),
                minWidthPercent: minBox.width,
                minHeightPercent: minBox.height,
              }),
            };
          }

          return {''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Guarded replacement expected 1 match, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
      - name: Commit validated page patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tools/fill-sign/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Lock Fill & Sign media boxes to intrinsic ratio"
          git push origin HEAD:codex/fill-sign-media-aspect-lock-v3
