name: Apply Fill Sign media aspect lock

on:
  push:
    branches:
      - codex/fill-sign-media-aspect-lock-v3

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fill-sign-media-aspect-lock-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Fill & Sign page
        run: python scripts/apply-fill-sign-media-aspect.py
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
      - name: Commit validated page patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tools/fill-sign/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Lock Fill & Sign media boxes to intrinsic ratio"
          git push origin HEAD:codex/fill-sign-media-aspect-lock-v3
