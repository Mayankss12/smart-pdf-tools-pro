name: Validate Fill Sign Selection Fix

on:
  push:
    branches:
      - fix/fill-sign-selection-resize

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Launch audit
        run: npm run audit:launch
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
